name: QA Suite — Login Module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Ejecutar la suite de pruebas ──────────────────────────────────
  tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run tests
        run: pytest --junitxml=reports/results.xml
        continue-on-error: true
        env:
          TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_INVALID_PASSWORD: ${{ secrets.TEST_INVALID_PASSWORD }}

      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 1

  # ── JOB 2: Análisis con GitHub Models ────────────────────────────────────
  ai-analysis:
    name: GitHub Models Analysis
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    timeout-minutes: 5
    permissions:
      models: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: test-reports
          path: reports/

      - name: Analyze with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install openai --quiet
          python scripts/analyze_results.py

  # ── JOB 3: Análisis de calidad con SonarCloud ────────────────────────────
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: test-reports
          path: reports/

      - name: Verificar SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN está vacío — verificar el secret en GitHub"
            exit 1
          fi
          echo "SONAR_TOKEN recibido correctamente (longitud: ${#SONAR_TOKEN} caracteres)"

      - uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d # v5.0.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}

  # ── JOB 4: Publicar reporte HTML descargable ─────────────────────────────
  report:
    name: Upload HTML Report
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    timeout-minutes: 5

    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: test-reports
          path: reports/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reporte-qa-${{ github.run_number }}
          path: reports/reporte_po.html
          retention-days: 30
