name: QA Suite — Login Module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Ejecutar la suite de pruebas ──────────────────────────────────
  tests:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run tests
        run: pytest --junitxml=reports/results.xml
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 1

  # ── JOB 2: Análisis con GitHub Models ────────────────────────────────────
  ai-analysis:
    name: GitHub Models Analysis
    runs-on: ubuntu-latest
    needs: tests
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports/

      - name: Analyze with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install openai --quiet
          python scripts/analyze_results.py

  # ── JOB 3: Análisis de calidad con SonarCloud ────────────────────────────
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: tests
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports/

      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── JOB 4: Publicar reporte HTML descargable ─────────────────────────────
  report:
    name: Upload HTML Report
    runs-on: ubuntu-latest
    needs: tests
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports/

      - uses: actions/upload-artifact@v4
        with:
          name: reporte-qa-${{ github.run_number }}
          path: reports/reporte_po.html
          retention-days: 30
